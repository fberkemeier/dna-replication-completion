[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dnascape"
version = "1.0.0"
description = "DNAscape: tools for modelling and simulating DNA replication kinetics."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "seaborn",
  "scipy",
]

[project.scripts]
dnascape = "dnascape.cli:main"

[tool.setuptools]
packages = ["dnascape"]
